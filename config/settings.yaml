# ==========================================================================
# MASTER CONFIG — tune the whole system from this one file.
# Everything here is hot-reloadable via POST /api/config/reload
# ==========================================================================

system:
  name: "panadhanam"
  timezone: "Asia/Kolkata"
  # How often the CMIO runs a full analysis cycle during market hours.
  cycle_seconds: 60
  # A symbol already held is not re-scanned for a new entry: the position
  # manager runs its stop, target and Standard Pyramid adds.
  skip_held_symbols: true
  # Pre-market scan (fundamental filter + macro/gap read) runs once at this time.
  premarket_scan_time: "08:45"
  market_open: "09:15"
  market_close: "15:30"
  # Stop opening NEW positions this many minutes before close.
  # New entries until 15 min before the close, square-off at 15:25 (the
  # user's call, 5 Oct 2026; was 15:00 / 15:15). The US: markets/us.yaml.
  no_new_entry_after: "15:15"
  square_off_time: "15:25"

# --------------------------------------------------------------------------
# CAPITAL & RISK — the non-negotiable guardrails.
# The Risk Manager is deterministic Python, NOT an LLM. It cannot be
# talked out of these numbers by any prompt.
# --------------------------------------------------------------------------
risk:
  # GENERAL setups only: no short below short_min RSI, no long above
  # long_max (stretched moves snap back). Off here; set per market.
  rsi_guard: {enabled: false, short_min: 25, long_max: 75}
  # No more entries after this many losing trades in a day (0 = off; US: 2).
  max_losses_per_day: 0
  # Account size every position is sized against. Set it per-machine with
  # TOTAL_CAPITAL in .env, which overrides this file and survives a git pull:
  #
  #     python run.py --set TOTAL_CAPITAL=100000
  #
  # You can also change it live from the dashboard (Capital tile → "edit"), or
  # edit the value here — but this file is tracked, so an edit here is a change
  # to a file git owns and the next pull will argue with it.
  #
  # NOTE at very small values: risk_per_trade_pct of a tiny account rounds to
  # zero shares for most instruments, so the board shows WATCH with "cannot fit
  # even one share" and you get almost no fills to learn from. 10,000 is a
  # sensible practice size. That is the sizing maths being honest, not a fault
  # — and small capital does not make live trading safer, staying in paper does.
  # $4,000 paper: 1% risk is $40 a trade; option premium per trade is capped
  # at 20% ($800), or 25% ($1,000) on SPY/QQQ/DIA; the day stops at -3%
  # ($120). start.sh applies this figure once to a .env left at an earlier
  # shipped value; editing Capital on the dashboard afterwards still sticks.
  total_capital: 4000
  # ACTIVE PAPER PROFILE: many trades to learn from (loose entry gates, five
  # positions, 60 names, top 5 per band), each one small, with a hard ceiling
  # on what can be lost at once and in a day.
  risk_per_trade_pct: 1.0        # 1% of capital risked per trade, while learning
  max_risk_per_trade_pct: 2.0    # hard ceiling — never exceed
  # Daily hard-loss circuit breaker: when realised + open P&L reaches -3%
  # ($120 on $4,000; ₹10,500 on ₹3,50,000), every open position is closed at
  # market, the desk halts and the day is disarmed. The lockout is SAVED: it
  # holds for the rest of the calendar day, restarts included.
  max_daily_loss_pct: 3.0
  circuit_breaker: true
  # The tournament throttles (as in panaoptions): two positions at once and
  # four trades a day. Over-trading is how a good morning is given back.
  max_open_positions: 2
  max_daily_trades: 4
  # Portfolio heat: the total that would be lost if EVERY open position hit
  # its stop together (a headline moving correlated names at once). Five at 1%
  # would be 5%; the cap holds it at 4% — the fifth trade takes what is left.
  max_portfolio_heat_pct: 4.0
  # Anti-stacking: one position per symbol, and a symbol that has just closed
  # a trade goes on a cooldown blacklist for this long — no sequential
  # re-entries on the same ticker in a choppy session (the XOM / AVGO runs).
  one_position_per_symbol: true
  reentry_cooldown_minutes: 60
  # The stop sits at least max(min_stop_atr x ATR, min_stop_pct % of the
  # price) from entry — a structural level inside a normal bar's range is hit
  # by noise alone. Since 30 Sept 2026 (was 1.0 x ATR, no % floor): on the
  # 20-session replay with the pyramid, India -0.38% -> +1.31% (DD 1.75% ->
  # 0.64%), US +1.76% -> +6.41% (DD 5.0% -> 3.89%). The target is 3R from the
  # widened stop; the size shrinks to keep the 1% risk.
  min_stop_atr: 1.5
  min_stop_pct: 0.75
  # Cap each position at max exposure / max_open_positions, so a tight stop
  # cannot size one trade into the whole limit and crowd out the rest.
  split_exposure_across_positions: true
  max_exposure_pct: 100.0        # max notional as % of (capital x intraday_leverage); was 50
  # Your broker's intraday (MIS) margin multiplier. 1.0 = assume NO leverage,
  # which is the safe default: a 1L account can then hold at most 50k of stock.
  # Indian brokers typically allow ~5x on MIS for liquid names — set it to what
  # YOUR broker actually gives you. This only widens position size; it never
  # relaxes the per-trade risk limit, which stays 1-2% of real capital.
  # HIGH-RISK PAPER PROFILE: 4x, the standard US intraday (pattern day
  # trader) buying power; Indian MIS is typically ~5x. At 1.0 one SPY trade at
  # 2% risk used ~$88k of a $100k account, so "5 positions" was really two.
  intraday_leverage: 4.0
  # 1:3 minimum. The target is set at this multiple of the stop distance, and
  # the trade is refused when the previous-day high (long) or low (short) sits
  # inside it (fno_confluence.room_check). Was 1.5.
  min_risk_reward: 3.0
  # Room to the PDH (long) / PDL (short): 3R or more -> the 3R target; from
  # min_r to 3R -> approved with the target snapped `ticks` inside the level
  # (RBLX's 2.7R was refused before); under min_r -> refused.
  target_snap:
    enabled: true
    min_r: 2.2
    ticks: 2
  max_risk_reward: 10.0          # sanity ceiling (implausible targets rejected)
  # Stop loss must be a real structural level, not a round number guess.
  min_stop_distance_pct: 0.15    # SL closer than this = "ill-defined", rejected
  max_stop_distance_pct: 3.0     # SL further than this = position too small/risky
  atr_stop_multiplier: 1.5       # fallback SL = entry -/+ 1.5 * ATR(14)

  # --- Structural stop placement -----------------------------------------
  # Put the stop 1-2 TICKS beyond the actual support level or panic wick where
  # buyers stepped in, not at a round percentage. A round number is where
  # everyone else's stop sits, which is exactly where price goes hunting.
  structural_stop_ticks: 2       # ticks BEYOND the level, not at it
  prefer_structural_stop: true   # fall back to ATR only when no level is named

  # --- Time stop -----------------------------------------------------------
  # A mean-reversion entry is a bet that buyers are absorbing supply. If it has
  # not bounced within this many minutes, the bet is simply wrong — supply is
  # still in control. Exit at market rather than waiting for the price stop.
  time_stop_minutes: 30
  time_stop_setups: ["Mean Reversion"]   # which setups the timer applies to
  # Setups that are NEVER time-stopped: they run to the target, the stop or
  # the intraday square-off.
  no_time_stop_setups: ["PD Liquidity Sweep", "Volatility Breakout",
                        "SJK 50-200 · EMA Pullback", "SJK 9-15-21 · EMA Fan",
                        "SJK 9/21 · VWAP · ADX", "sjk912RSi · 9/21 EMA + RSI",
                        "SJK 1 · 50/200 EMA Pullback"]   # SJK 50-200's name until 5 Oct
  # --- The Standard Pyramid (Base-50-25): add to winners, never to losers --
  # Base entry at 1R fractional sizing (risk_per_trade_pct / stop distance).
  # At +1.0R open: ADD 50% of the base, and the stop for the WHOLE position
  # moves to the base entry. At +2.0R: ADD 25% of the base, stop to the Level 1
  # fill. One take-profit at +3.0R from the base entry closes the full 175%.
  # Worst case after Level 1: -0.5R; after Level 2: +0.75R locked. An add is
  # refused while the position is in a drawdown (no averaging down), when the
  # desk is halted, past the entry cutoff, or over the exposure cap — the stop
  # still steps up. See app/agents/pyramid.py.
  pyramid:
    enabled: true
    target_r: 3.0
    levels:
      - {at_r: 1.0, size: 0.50, stop: "base"}
      - {at_r: 2.0, size: 0.25, stop: "level1"}
  # (Unused: the pyramid's stop steps replace a separate trail.)
  trail_after_r: 1.0
  trail_step_r: 0.5
  # Options-specific. Premium per trade is capped at max_capital_deployed_pct
  # of capital (20% = $800), flexed for the high-notional index ETFs to
  # index_max_capital_deployed_pct (25% = $1,000) so a valid at- or near-the-
  # money SPY/QQQ contract is not refused on notional alone. "DJI" = DIA.
  max_capital_deployed_pct: 20.0
  index_max_capital_deployed_pct: 25.0
  index_symbols: ["SPY", "QQQ", "DIA"]
  # Refuse an option whose bid-ask spread is over this share of the mid.
  # A leg with no two-sided quote is let through unless reject_unquoted_spread.
  max_spread_pct_of_mid: 7.0
  reject_unquoted_spread: false
  # Option stops sit on the UNDERLYING: the 5m swing low/high over this many
  # bars plus structural_stop_ticks, else atr_stop_multiplier x ATR.
  swing_lookback_bars: 6
  # Options only: refuse when IV RANK (today's ATM IV within this symbol's own
  # past-year range) is above this — buying right before IV falls crushes the
  # premium even if the stock moves. Needs iv_rank_min_samples days of IV
  # history (recorded automatically from real chains); until then the
  # stand-in is IV above iv_over_realised_max x the stock's realised volatility.
  reject_if_iv_rank_above: 80.0
  iv_rank_min_samples: 20
  iv_over_realised_max: 1.5

# --------------------------------------------------------------------------
# CONFIRMATION POLICY — how many agents must agree before a signal fires.
# --------------------------------------------------------------------------
consensus:
  # HIGH-RISK PAPER PROFILE: one strong analyst is enough (was 2), at a lower
  # combined score (was 0.35), and a disagreement sides with the chart rather
  # than cancelling out. Most setups used to stop right here.
  min_confirmations: 1           # analysts voting ±0.25 or stronger
  min_composite_score: 0.25      # weighted score threshold (-1..+1)
  # News veto override: news polarity stronger than ±news_veto_polarity that
  # contradicts the trade (-0.65 under a BUY, +0.65 under a SELL) is an
  # ABSOLUTE veto — no conflict policy or model synthesis overrides it.
  veto_on_high_impact_news: true
  news_veto_polarity: 0.60
  require_macro_alignment: false # set true to demand macro bias agreement too
  # technicals_unless_derivatives_oppose: the chart wins against news or
  # macro, but never trades against the options & futures read — a breakout
  # into an open-interest wall usually fails. If the options analyst has no
  # real chain it abstains, and the chart may trade alone.
  conflict_policy: "technicals_unless_derivatives_oppose"
  # An analyst scoring under silent_below has nothing to say this cycle. With
  # silent_analysts_dilute false it is left out of the average instead of
  # dragging a real reading toward zero (three quiet analysts made a +0.36
  # chart read +0.12). true is the conservative setting.
  silent_analysts_dilute: false
  silent_below: 0.10
  # At least one of these must agree with the trade. News and macro are
  # mostly market-wide, so alone they would put the same trade on every name.
  lead_analysts: ["candlestick", "derivatives", "volume_profile"]
  # The strict 2-analyst quorum: the candlestick trigger at +/-primary_min AND
  # one confirmer at +/-confirm_min the same way. OFF: on the 20-session
  # replay it left 5 of 4,085 India setups and 0 of 3,687 US (the volume
  # profile rarely votes, and India's chain has no OI for the derivatives
  # analyst) — it would stop the desk. The model synthesis obeys it when on.
  # A GENERAL setup (no named strategy: not PD sweep, volatility breakout or
  # SJK 50-200) needs this many analysts voting its way at +/-general_agree_min.
  # 0 = off; set per market (config/markets/*.yaml).
  general_min_analysts: 0
  general_agree_min: 0.25
  quorum:
    enabled: false
    primary: "candlestick"
    primary_min: 0.35
    confirmers: ["volume_profile", "derivatives", "macro_flow", "news_sentiment"]
    confirm_min: 0.25
  # No counter-trend trades: no long below VWAP or into a falling (stacked)
  # 15-minute trend, no short above VWAP or into a rising one.
  trend_filter: true
  # ...except a volume-profile reversal: buying a call at the VAL or POC is by
  # design against the move that brought price there. When the Volume Profile
  # analyst triggers in the trade's direction the trend filter stands aside.
  trend_filter_exempt_volume_profile: true
  # ...and a confirmed Previous Day Liquidity Sweep, a reversal by design.
  trend_filter_exempt_pd_sweep: true

# --------------------------------------------------------------------------
# NEWS BLACKOUT — no new entries around high-impact macro releases.
# --------------------------------------------------------------------------
news_blackout:
  enabled: true
  minutes_before: 15
  minutes_after: 15
  # Scheduled releases, in the MARKET's own time ("YYYY-MM-DD HH:MM"). Only
  # releases inside the session matter — CPI and payrolls print at 08:30 ET,
  # before the US open. Add RBI policy days under IN.
  events:
    US:
      # FOMC rate decisions, 2026 (statement at 14:00 ET)
      - { name: "FOMC decision", at: "2026-01-28 14:00" }
      - { name: "FOMC decision", at: "2026-03-18 14:00" }
      - { name: "FOMC decision", at: "2026-04-29 14:00" }
      - { name: "FOMC decision", at: "2026-06-17 14:00" }
      - { name: "FOMC decision", at: "2026-07-29 14:00" }
      - { name: "FOMC decision", at: "2026-09-16 14:00" }
      - { name: "FOMC decision", at: "2026-10-28 14:00" }
      - { name: "FOMC decision", at: "2026-12-09 14:00" }
    IN: []
  # A headline naming one of these within the last minutes_after minutes
  # also starts a blackout — for releases nobody put in the calendar.
  headline_keywords: ["FOMC", "Fed decision", "rate decision", "nonfarm payrolls",
                      "CPI report", "inflation data", "RBI policy", "repo rate"]

# --------------------------------------------------------------------------
# FOCUS LIST — which names the desk actually watches and trades.
# --------------------------------------------------------------------------
focus:
  # Every rerank_minutes the whole watchlist (bands A, B, C) is scored the way
  # a trade is — every analyst, then the weighted vote — and the top per_band
  # names of each band become the ONLY ones cycled on and traded until the
  # next re-rank. Open positions are always managed, on the list or not.
  enabled: true
  per_band: 5
  rerank_minutes: 15

# --------------------------------------------------------------------------
# DECISIONS — may the local model change a trade decision?
# --------------------------------------------------------------------------
decisions:
  # false: the analysts and the CMIO decide by their rules, in seconds. The
  # model (Ollama or Claude) still writes the journal post-mortems and the
  # weekly coach. true: it re-scores every analyst and can veto the vote,
  # which with a local 7B model took ~25 s a symbol and turned down setups
  # the rules had passed.
  use_llm: false

# --------------------------------------------------------------------------
# AGENT WEIGHTS — the learning loop nudges these over time (see learning:).
# Edit freely; values are normalised at runtime.
# --------------------------------------------------------------------------
# The Friday self-reflection (scripts/ollama_feedback.py): after Friday's
# close the week's graded trades go to Ollama, which returns multipliers for
# the four voting analysts below. They are bounded and written to
# config/strategy_weights.json (git-ignored), which the CMIO applies on top
# of these weights. Delete that file to go back to these numbers.
# PRE-MARKET SCREENER (app/analysis/pre_market_screener.py) — the day's
# tradeable names, picked before the open from YESTERDAY's daily bars across
# the index universe, saved to data/runtime/todays_watchlist.json. The desk
# trades nothing else that day (required: no list = no entries).
#   Band A (top 5): ATR% >= 2.0, RVOL >= 1.2, NR7 or an inside day; by RVOL.
#   Band B (next 5): ATR% >= 2.0, RVOL >= 1.5, close in the top 20% of the
#     range (longs only) or the bottom 20% (shorts only); by RVOL.
# Windows (the market's clock; India 09:30-11:15 Band A, 11:15-13:30 freeze,
# 13:30-14:45 Band A/B VWAP pullbacks within vwap_pullback_atr of VWAP).
screener:
  enabled: true
  required: true
  run_at: "09:00"
  history_days: 40
  vwap_pullback_atr: 0.5
  # Dynamic Band B promotion: a Band B name may enter in the MORNING window
  # when its regime trends its way (trending_up long / trending_down short)
  # and its composite is +min_composite or more (-min_composite for a short).
  band_b_promotion: {enabled: true, min_composite: 0.85}
  band_a: {size: 5, min_atr_pct: 2.0, min_rvol: 1.2}
  band_b: {size: 5, min_atr_pct: 2.0, min_rvol: 1.5,
           long_close_location: 0.80, short_close_location: 0.20}
  windows:
    morning_from: "09:30"
    morning_to: "11:15"
    afternoon_from: "13:30"
    afternoon_to: "15:15"     # 15 min before the close (5 Oct 2026; was 14:45)
    # No new GENERAL entry (no named strategy) from this time, market clock;
    # the named strategies keep their own windows. Empty = off; per market.
    general_to: ""

# VOLUME PROFILE — the Volume Profile analyst and the CMIO's confluence rule.
# Sessions follow the active market's hours (US 09:30-16:00 ET) unless
# rth_open / rth_close are set here.
volume_profile:
  bins: 40
  value_area_pct: 0.70
  lvn_ratio: 0.30          # a bin at <= 0.30x the mean bin is thin (LVN)
  hvn_ratio: 1.5           # a bin at >= 1.5x the mean bin is thick (HVN)
  strategies:
    # va_rejection and poc_bounce are OFF: the worst two in every panaoptions
    # backtest on 29 Sept 2026 (US -1.23R / -1.08R a trade in the test half).
    va_rejection: false    # failed auction at the VAH (put) / VAL (call) → POC
    lvn_acceleration: true # shelf → close into a volume pocket on RVOL ≥ 1.5x
    poc_bounce: false      # ≥ 1 ATR away, back to the POC, rejected there
  va_lookback_bars: 2
  lvn_min_rvol: 1.5
  lvn_shelf_bars: 3
  poc_away_atr: 1.0
  # CMIO confluence on every trade: an entry at a VAL/POC (long) or VAH/POC
  # (short) moves the composite alignment_boost toward the trade; a thick HVN
  # straight ahead costs hvn_penalty within hvn_near_atr ATR, and vetoes
  # within hvn_veto_atr ATR (unless it holds the trade's own target).
  alignment_tolerance_atr: 0.25
  alignment_boost: 0.30
  hvn_near_atr: 1.0
  hvn_veto_atr: 0.25
  hvn_penalty: 0.30

feedback:
  enabled: true
  min_trades: 5          # fewer closed trades in the week = no adjustment
  max_step: 0.15         # no multiplier moves more than this in one week

weights:
  candlestick: 1.0
  volume_profile: 1.0
  derivatives: 1.0
  news_sentiment: 0.8
  macro_flow: 0.7
  fundamental: 0.5

# --------------------------------------------------------------------------
# TECHNICAL ANALYSIS
# --------------------------------------------------------------------------
technical:
  # The analysts judge CLOSED intraday candles only: the feed's last bar is
  # still forming (Yahoo includes it). Exits follow the live quote.
  completed_bars_only: true
  # In market hours, a timeframe whose last closed bar ended more than this
  # many bars ago is treated as no data (the feed stopped updating). Candles
  # come from Yahoo query1, else query2, else 5m/15m rebuilt from 1m bars.
  stale_after_bars: 3
  timeframes: ["1m", "5m", "15m", "1d"]
  primary_timeframe: "5m"
  emas: [9, 20, 21, 50]      # 20: the trend-pullback level (fno_confluence)
  rsi_period: 14
  atr_period: 14
  vwap: true
  volume_surge_multiplier: 1.8   # vs 20-period average volume
  breakout_lookback: 20
  patterns_enabled:
    - bullish_engulfing
    - bearish_engulfing
    - hammer
    - shooting_star
    - doji
    - morning_star
    - evening_star
    - inside_bar
    - flag
    - tweezer_bottom
    - tweezer_top
    - double_rejection_bottom
    - double_rejection_top

# --------------------------------------------------------------------------
# PREVIOUS DAY LIQUIDITY SWEEP (failed breakout) — US and India, intraday
# --------------------------------------------------------------------------
# Price pierces the previous-day HIGH (or LOW) and the 5m or 15m candle
# closes back inside yesterday's range: the breakout traders are trapped.
#   PDH sweep -> SHORT, only if the sweep candle is a Shooting Star or a
#                Bearish Engulfing
#   PDL sweep -> LONG,  only if it is a Hammer or a Bullish Engulfing
# The candlestick analyst scores a confirmed sweep 1.0. The stop is exactly
# stop_ticks beyond the sweep candle's wick; the target is the day's VWAP or
# min_reward_risk (3R), whichever is further; there is no time stop — it runs
# to the target, the stop, or the square-off (15:15 India).
# --------------------------------------------------------------------------
# THE GOLD DESK — instruments with swing: true (GOLDBEES in India, GLD in
# the US): the volatility breakout held 1-4 days, as backtested on two years
# of hourly bars (panaoptions: python run.py --swing-backtest). GOLDBEES
# +0.43R / +0.58R a trade on the stock, +0.37R on the last 60 days of
# 5-minute bars; GLD +0.24R / +0.21R, +0.30R. Gold rose through 2025-26.
#   entry  the first 5m bar today whose high (low) reaches today's open
#          +/- k x yesterday's range, with the trend_days trend
#   stop   2 ticks beyond today's open; target 3R
#   exit   the first later session that opens in profit, else the stop or
#          target, else the square-off of the max_hold_days-th session
# No morning screener and no other strategy on these instruments.
# --------------------------------------------------------------------------
swing:
  k: 0.5
  trend_days: 20
  minutes_after_open: 5
  to: "15:15"               # 15 min before the close (5 Oct 2026; US 15:45)
  max_hold_days: 4
  first_profitable_open: true

# --------------------------------------------------------------------------
# VOLATILITY BREAKOUT (Larry Williams, 1987 Robbins World Cup) — intraday
# --------------------------------------------------------------------------
# The FIRST closed 5m candle beyond today's open +/- k x yesterday's range,
# with VWAP and the 9/21 EMAs agreeing. Stop stop_ticks beyond today's open,
# target risk.min_risk_reward (3R), no time stop, no room check. Scored
# `score` by the candlestick analyst. Off here; on for the US (us.yaml)
# after the 20-session walk-forward — see app/strategies/vol_breakout.py.
vol_breakout:
  enabled: false
  k: 0.5
  score: 0.9
  minutes_after_open: 30
  to: "15:15"               # 15 min before the close (5 Oct 2026; was 14:30; US 15:45)
  stop_ticks: 2

# SJK 50-200 — the user's 50 / 200 EMA pullback continuation (app/strategies/sjk50_200.py).
# TRIAL from 2 Oct 2026, the user's call, both markets. Long: above the 200
# EMA, a pullback to the 50 EMA that never closes below the 200, then the
# FIRST 5m close above the swing high made before it; stop the pullback's
# swing low; target 1:rr, sold there. Short: the mirror. One trade per swing.
sjk50_200:
  enabled: true
  score: 0.9                # the candlestick analyst's vote, like the breakout
  from: "09:45"             # market time (India: markets/india.yaml)
  to: "15:45"               # US: 15 min before the close (5 Oct 2026; India 15:15)
  fast: 50                  # EMA periods, on the 5m close
  slow: 200
  swing_lookback: 3         # bars each side that make a swing high / low (3-5)
  touch_pct: 0.15           # the pullback must come within 0.15% of the 50 EMA
  max_age_bars: 36          # the pullback swing at most 3 hours old
  rr: 2.5                   # target = entry + 2.5 x risk (2, 3 or 4 also); judged at it
  stop_buffer: 0.0          # beyond the swing for the stop in price (0 = at it)
  stop_ticks: 0             # ...or in ticks, at the risk desk
  breakeven_r: 0            # 1.5 = stop to breakeven at +1.5R (0 = off)
  trail_r: 0                # after breakeven, trail this many R behind the best (0 = off)

# SJK 9-15-21 — the user's 9 / 15 / 21 EMA Master Strategy (5 Oct 2026),
# app/strategies/sjk_9_15_21.py. TRIAL, both markets. Long when the 9 > 15 >
# 21 EMAs fan out, separated and trending: the confirming close, or a pullback
# to the 9/15 band that closes back above the 9. Short the mirror. Sideways /
# Choppy = no order. One trade per continuous alignment. Stop at the swing
# (else the 21 EMA), target 1:rr, sold there; no time stop.
sjk_9_15_21:
  enabled: true
  score: 0.9                # the candlestick analyst's vote
  from: "09:45"             # market time (India: markets/india.yaml)
  to: "15:45"
  fast: 9                   # EMA periods on the 5m close (chart: purple / blue / grey)
  mid: 15
  slow: 21
  # v2 (5 Oct 2026, the user's spec): CHOPPY/SIDEWAYS when |EMA9 - EMA21| <
  # spread_atr x ATR(14), the EMAs not all sloping the trade's way, or EMA 9/21
  # crossing max_crosses+ times in whipsaw_bars bars.
  spread_atr: 0.35
  whipsaw_bars: 12
  max_crosses: 2
  breakout_body: 0.60       # trigger A: close in the top 40% of the bar (bottom for a short)
  triggers: "both"          # "both" (ALIGNMENT_BREAKOUT + RIBBON_PULLBACK) or "pullback"
  swing_lookback: 5         # stop: min(lowest low of 5 bars, EMA 21) - stop_atr x ATR
  stop_atr: 0.20
  stop_ticks: 0             # ...the risk desk adds this many ticks beyond (0 = at it)
  rr: 2.0                   # target 1:2; judged at it
  breakeven_r: 0
  trail_r: 0

# SJK 9/21 · VWAP · ADX — the user's confluence model (sjk912_vwapadx, 5 Oct
# 2026), app/strategies/sjk912_vwapadx.py. TRIAL. BUY when the 9 EMA crosses
# above the 21 EMA with the close above the session VWAP, and the NEXT candle
# confirms (closes above the 9 EMA and VWAP) with ADX(14) > 20; enter on that
# close, stop at the crossover candle's low, target 1:rr. SELL the mirror.
# Sideways / Choppy (ADX <= 20, 9/21 crossing back and forth, or EMAs, VWAP
# and price bunched in band_pct) = no entry.
sjk912_vwapadx:
  enabled: true
  score: 0.9
  from: "09:45"             # market time (India: markets/india.yaml)
  to: "15:45"
  fast: 9
  slow: 21
  adx_period: 14
  adx_smoothing: 14
  # v2 (5 Oct 2026, the user's spec): ADX > adx_min AND rising, with the trade's
  # DI leading; the confirmation close within vwap_cap_atr x ATR of VWAP; stop
  # min(crossover low, confirmation low) - stop_ticks ticks, at least
  # min_stop_atr x ATR away. CHOPPY: ADX <= 20, |EMA9 - EMA21| < min_spread_atr
  # x ATR, or VWAP trapped between the EMAs.
  adx_min: 20.0
  vwap_cap_atr: 2.5
  min_stop_atr: 1.0
  stop_ticks: 2
  min_spread_atr: 0.25
  rr: 2.0                   # Target 1 at 1:2; judged at it
  exit_mode: "target"       # live: all at Target 1. The backtest also runs "split"
                            # (half at Target 1, the runner to the opposing crossover)
  breakeven_r: 0
  trail_r: 0

# sjk912RSi — the user's 9/21 EMA + RSI crossover (5 Oct 2026),
# app/strategies/sjk912rsi.py; the same rules for TradingView in
# pine/sjk912RSi.pine. TRIAL. LONG when the 9 EMA crosses above the 21 (entry
# that bar or up to cross_within bars after), a green candle opening and
# closing above both EMAs, RSI(14) > 50; stop the lowest low of the 5 bars
# before; target 1:rr. SHORT the mirror. One entry per crossover.
sjk912rsi:
  enabled: true
  score: 0.9
  from: "09:45"             # market time (India: markets/india.yaml)
  to: "15:45"
  fast: 9
  slow: 21
  rsi_length: 14
  # v2 (5 Oct 2026, the user's spec): RSI strictly inside 50-68 for a long,
  # 32-50 for a short (no chasing exhaustion); the entry within cross_within
  # bars of the crossover; the low (high) clear of the 21 EMA; not in the first
  # warmup_bars bars of the session; stop min(lowest low of 5, close -
  # min_stop_atr x ATR(14)).
  rsi_level: 50.0
  rsi_long_max: 68.0
  rsi_short_min: 32.0
  cross_within: 3
  warmup_bars: 5
  swing_lookback: 5
  min_stop_atr: 0.5
  rr: 2.0
  stop_ticks: 0
  breakeven_r: 0
  trail_r: 0

pd_sweep:
  enabled: true
  timeframes: ["5m", "15m"]
  score: 1.0
  stop_ticks: 2
  min_reward_risk: 3.0
  # The sweep is itself the PDH/PDL condition of the F&O confluence rule;
  # true also demands rising call (PDL) / put (PDH) open interest.
  require_rising_oi: false

# --------------------------------------------------------------------------
# PREVIOUS-DAY F&O CONFLUENCE
# --------------------------------------------------------------------------
# Every symbol's previous session is mapped each day — PDH / PDL / PDC, call
# and put open interest and their change since the previous close, and the
# build-up (Long Buildup, Short Buildup, Short Covering, Long Unwinding) — and
# stored for the review.
#
# A trade DRIVEN by a reversal pattern (tweezer, double rejection, hammer,
# engulfing, star) is taken only:
#   bullish: after a sweep-and-reject of the previous-day LOW, call OI rising
#   bearish: after a test-and-reject of the previous-day HIGH, put OI rising
fno_confluence:
  enabled: true
  touch_atr: 0.15            # "at the level": within this x ATR
  lookback_bars: 3           # the sweep / test within the last N bars
  # No real chain (no OI): block the reversal (strict) or allow on price alone.
  when_oi_unknown: "block"
  # By regime (since 30 Sept 2026 — the midday logs refused sound trend
  # trades for not being at yesterday's high/low):
  #   rangebound / volatile   the pattern at the PDL (longs) / PDH (shorts),
  #                           within rangebound_proximity_pct, with the OI rule
  #   trending_up long,       no PDH/PDL: a pullback within trend_pullback_pct
  #   trending_down short     of VWAP, the session POC or the 9/20 EMA
  #   against the trend       the rangebound rule
  regime_rules: true
  rangebound_proximity_pct: 0.25
  trend_pullback_pct: 0.30
  # Refuse a trade whose 1:3 target lies beyond the previous-day high (long) or
  # low (short).
  room_check: true

# --------------------------------------------------------------------------
# DERIVATIVES / OPTION CHAIN
# --------------------------------------------------------------------------
derivatives:
  strikes_around_atm: 10
  pcr_bullish_above: 1.2
  pcr_bearish_below: 0.7
  oi_change_significant_pct: 15.0
  iv_spike_pct: 20.0
  risk_free_rate: 0.065
  preferred_moneyness: "ATM"     # ATM | ITM | OTM
  # 3-7 days: far enough out that intraday theta decay and a volatility crush
  # during a 15-minute pause do not eat the premium; close enough to move.
  # 0-2 DTE options are never bought.
  max_days_to_expiry: 7
  min_days_to_expiry: 3
  avoid_expiry_day_after: "14:00"

# --------------------------------------------------------------------------
# NEWS & MACRO
# --------------------------------------------------------------------------
news:
  lookback_minutes: 180
  max_items_per_cycle: 40
  high_impact_threshold: 0.7
  sources:
    - name: "Moneycontrol Markets"
      type: rss
      url: "https://www.moneycontrol.com/rss/marketreports.xml"
    - name: "Moneycontrol Business"
      type: rss
      url: "https://www.moneycontrol.com/rss/business.xml"
    - name: "Economic Times Markets"
      type: rss
      url: "https://economictimes.indiatimes.com/markets/rssfeeds/1977021501.cms"
    - name: "Livemint Markets"
      type: rss
      url: "https://www.livemint.com/rss/markets"
    - name: "Business Standard Markets"
      type: rss
      url: "https://www.business-standard.com/rss/markets-106.rss"
    - name: "Google News — NSE"
      type: rss
      url: "https://news.google.com/rss/search?q=NSE+OR+Nifty+OR+Sensex+when:1d&hl=en-IN&gl=IN&ceid=IN:en"

macro:
  # Symbols pulled for the global read. Adapter maps these per-provider.
  global_indices:
    - { key: "gift_nifty",   label: "GIFT Nifty" }
    - { key: "us_sp500",     label: "S&P 500 Futures" }
    - { key: "us_nasdaq",    label: "Nasdaq Futures" }
    - { key: "dow",          label: "Dow Futures" }
    - { key: "crude",        label: "Brent Crude" }
    - { key: "dxy",          label: "Dollar Index" }
    - { key: "usdinr",       label: "USD/INR" }
    - { key: "india_vix",    label: "India VIX" }
  vix_panic_level: 20.0
  vix_calm_level: 12.0

# --------------------------------------------------------------------------
# FUNDAMENTAL PRE-MARKET FILTER
# --------------------------------------------------------------------------
fundamental:
  enabled: true
  min_roe: 20.0
  max_pe_vs_industry_ratio: 1.2   # P/E must be <= 1.2x industry average
  max_absolute_pe: 60.0
  require_positive_eps: true
  min_profit_growth_pct: 5.0
  min_avg_volume: 500000
  max_debt_to_equity: 1.5

# --------------------------------------------------------------------------
# LEARNING LOOP — the system grades its own signals and re-weights agents.
# --------------------------------------------------------------------------
learning:
  enabled: true
  # Exponentially weighted update of agent weights from realised outcomes.
  method: "ewma"                 # ewma | thompson | off
  alpha: 0.08                    # learning rate
  min_samples_before_update: 15
  weight_floor: 0.2
  weight_ceiling: 2.0
  # Regime detection: the system keeps separate stats per market regime so a
  # strategy that works in a trend isn't punished for a chop day.
  regimes: ["trending_up", "trending_down", "rangebound", "volatile"]
  lookback_days: 60
  # Feed the last N graded signals back into the CMIO prompt as context.
  recall_examples: 8

# --------------------------------------------------------------------------
# MARKET DATA
# Where prices come from. Real data needs no API key and no signup.
# --------------------------------------------------------------------------
data:
  # true  = real prices from Yahoo Finance and (for India) NSE's own API
  # false = the synthetic demo market, for offline tinkering only
  use_real_data: true
  # NSE's official option chain gives genuine OI / IV per strike, which is what
  # makes PCR, Max Pain and buildup readings meaningful. It blocks some
  # networks and most non-Indian IPs; the stack falls back to Yahoo.
  use_nse: true
  # When no feed can serve an option chain (NSE unreachable, and Yahoo does not
  # publish Indian chains), should the system fabricate one?
  #   true  = generate a plausible chain so the F&O machinery still runs. It is
  #           labelled SIMULATED everywhere, but the OI, PCR and Max Pain are
  #           invented — never trade on them.
  #   false = serve no chain. The derivatives analyst then abstains, which is
  #           the honest behaviour if you trade F&O for real.
  synthetic_chain_fallback: true

  # Stooq is a third keyless source: reliable DAILY history, no option chains.
  # It is the safety net when Yahoo is blocked by a corporate network.
  use_stooq: true
  # Seconds to cache a quote before re-fetching. Be considerate to free feeds.
  quote_cache_seconds: 20

# --------------------------------------------------------------------------
# OPPORTUNITY BOARD — how setups are bucketed into low/medium/high risk.
# Each setup accumulates "risk points" from named factors (option vs cash,
# IV level, timeframe agreement, stop quality, confirmation depth, expiry
# proximity...). Lower = safer. Retune to your own tolerance.
# --------------------------------------------------------------------------
opportunities:
  low_risk_max_points: 1
  medium_risk_max_points: 4
  per_tier: 5                    # how many to show in each bucket
  # Minimum |composite score| for a symbol to appear on the board at all.
  min_conviction: 0.15

# --------------------------------------------------------------------------
# MARKETS
# --------------------------------------------------------------------------
markets:
  # Follow whichever market is trading, so one app covers both.
  #
  # India runs 03:45-10:00 UTC and the US 13:30-20:00 UTC, so the two sessions
  # never overlap and a single desk can serve both by following the clock.
  # This is NOT parallel trading: exactly one market is active at any moment,
  # which is the only arrangement where a single capital base and a single
  # daily loss limit mean anything.
  #
  # It will never interrupt a market that is still in session, and never
  # switches while a position is open — the new market's broker cannot manage
  # the old market's positions.
  #
  # To trade both at once you need two instances with two capital bases. See
  # docs/MARKETS.md.
  auto_follow_session: true

# --------------------------------------------------------------------------
# TRADING DAY — arming order placement
# --------------------------------------------------------------------------
trading_day:
  # Arm the desk by itself when the session opens, so you do not have to be at
  # the screen at 09:15 (or 09:30 ET) to press the button. The button still
  # works and still arms immediately.
  #
  # PAPER ACCOUNTS ONLY. This is refused on a real-money broker, deliberately
  # and without a setting to override it: committing real capital is a
  # decision a person takes each morning, not one a config file takes on your
  # behalf while you are asleep. On a real account you press the button.
  auto_arm_on_open: true

  # Write the day's summary to the dashboard and the log this many minutes
  # after square-off, so the result is waiting when you come back.
  summary_after_square_off_minutes: 5

# --------------------------------------------------------------------------
# EXECUTION
# --------------------------------------------------------------------------
execution:
  broker: "paper"
  order_type: "LIMIT"            # LIMIT | MARKET | SL-M
  limit_slippage_pct: 0.1
  product: "MIS"                 # MIS (intraday) | NRML | CNC
  variety: "regular"
  # true = approved signals become orders. On the paper broker (the default)
  # those are SIMULATED fills, which is the whole point of paper trading.
  #
  # This does NOT put real money at risk. A real-money broker additionally
  # requires TRADING_MODE=live AND ENABLE_LIVE_ORDERS=true in .env, and the
  # trading day must be armed — three switches and a daily decision, none of
  # which this flag touches. On a paper account it is simply the difference
  # between a desk that alerts and a desk that trades.
  #
  # AUTO_PLACE_ORDERS in .env overrides this per machine.
  auto_place_orders: true
  confirm_before_live: true

# --------------------------------------------------------------------------
# JOURNAL
# --------------------------------------------------------------------------
journal:
  # Grade every live trade the moment it closes, and write a Mistake Card to
  # journal/cards/. Turn this off only if you prefer logging by hand.
  auto_log_live_trades: true

# --------------------------------------------------------------------------
# ALERTING
# --------------------------------------------------------------------------
alerts:
  dashboard: true
  sound: true
  webhook_url: ""                # optional: Slack/Discord/Telegram relay
  telegram_bot_token: ""
  telegram_chat_id: ""
