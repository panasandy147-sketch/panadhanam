# ==========================================================================
# MARKET PROFILE — United States (NYSE / NASDAQ / CBOE)
#
# Structural differences from the India profile worth knowing:
#   * Equities trade in single shares, not exchange lots (lot_size: 1).
#   * Options are per-CONTRACT and each contract controls 100 shares, so the
#     premium you pay is quoted_price x 100. That is `contract_multiplier`,
#     which is a different thing from India's lot size and is handled
#     separately by the risk manager.
#   * Weeklies expire Friday, not Thursday.
#   * Session is 09:30-16:00 Eastern.
# ==========================================================================

market:
  code: "US"
  name: "United States"
  exchange: "NASDAQ"
  flag: "🇺🇸"
  timezone: "America/New_York"
  accent: "#3987e5"
  accent_dark: "#2a78d6"

currency:
  symbol: "$"
  code: "USD"
  locale: "en-US"
  grouping: "western"          # 100,000 not 1,00,000

session:
  market_open: "09:30"
  market_close: "16:00"
  premarket_scan_time: "08:45"
  no_new_entry_after: "15:30"
  square_off_time: "15:45"
  trading_days: [0, 1, 2, 3, 4]

derivatives:
  # US equity options are not lot-based; the contract multiplier does the work.
  lot_based: false
  contract_multiplier: 100
  weekly_expiry_weekday: 4     # Friday
  monthly_expiry_rule: "third_friday"
  strike_steps:
    SPY: 1
    QQQ: 1
    IWM: 1
    AAPL: 2.5
    MSFT: 5
    NVDA: 5
    TSLA: 5
    default_pct: 1.0

fundamentals:
  # US tickers need no Yahoo suffix.
  yahoo_suffix: ""

brokers:
  supported: ["paper", "alpaca"]
  default: "paper"

macro:
  vix_panic_level: 25.0        # VIX runs structurally higher than India VIX
  vix_calm_level: 14.0
  global_indices:
    - { key: "us_sp500",   label: "S&P 500 Futures", yahoo: "ES=F" }
    - { key: "us_nasdaq",  label: "Nasdaq Futures",  yahoo: "NQ=F" }
    - { key: "dow",        label: "Dow Futures",     yahoo: "YM=F" }
    - { key: "russell",    label: "Russell 2000",    yahoo: "RTY=F" }
    - { key: "vix",        label: "CBOE VIX",        yahoo: "^VIX" }
    - { key: "us10y",      label: "US 10Y Yield",    yahoo: "^TNX" }
    - { key: "dxy",        label: "Dollar Index",    yahoo: "DX-Y.NYB" }
    - { key: "crude",      label: "WTI Crude",       yahoo: "CL=F" }
    - { key: "gold",       label: "Gold",            yahoo: "GC=F" }

news:
  sources:
    - { name: "CNBC Markets", type: rss,
        url: "https://www.cnbc.com/id/20910258/device/rss/rss.html" }
    - { name: "CNBC Top News", type: rss,
        url: "https://www.cnbc.com/id/100003114/device/rss/rss.html" }
    - { name: "MarketWatch Top Stories", type: rss,
        url: "https://feeds.content.dowjones.io/public/rss/mw_topstories" }
    - { name: "Yahoo Finance", type: rss,
        url: "https://finance.yahoo.com/news/rssindex" }
    - { name: "Investing.com US", type: rss,
        url: "https://www.investing.com/rss/news_25.rss" }
    - { name: "Google News — US markets", type: rss,
        url: "https://news.google.com/rss/search?q=stock+market+OR+S%26P+500+OR+Nasdaq+when:1d&hl=en-US&gl=US&ceid=US:en" }

universe:
