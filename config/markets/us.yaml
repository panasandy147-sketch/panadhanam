# ==========================================================================
# MARKET PROFILE — United States (NYSE / NASDAQ / CBOE)
#
# Structural differences from the India profile worth knowing:
#   * Equities trade in single shares, not exchange lots (lot_size: 1).
#   * Options are per-CONTRACT and each contract controls 100 shares, so the
#     premium you pay is quoted_price x 100. That is `contract_multiplier`,
#     which is a different thing from India's lot size and is handled
#     separately by the risk manager.
#   * Weeklies expire Friday, not Thursday.
#   * Session is 09:30-16:00 Eastern.
# ==========================================================================

market:
  code: "US"
  name: "United States"
  exchange: "NASDAQ"
  flag: "🇺🇸"
  timezone: "America/New_York"
  accent: "#3987e5"
  accent_dark: "#2a78d6"

currency:
  symbol: "$"
  code: "USD"
  locale: "en-US"
  grouping: "western"          # 100,000 not 1,00,000

session:
  market_open: "09:30"
  market_close: "16:00"
  premarket_scan_time: "08:45"
  no_new_entry_after: "15:45"      # 15 min before the close (5 Oct 2026; was 15:30)
  square_off_time: "15:59"         # 15:59 from 2 Oct 2026, the user's call (was 15:45)
  trading_days: [0, 1, 2, 3, 4]

# The same shape on the US clock (ET): morning after the 15-minute range,
# the lunch freeze, an afternoon VWAP-pullback window; square-off 15:59.
screener:
  run_at: "09:00"
  # The daily-ATR floor 1.0% (was 2.0%) with the volatility breakout on
  # (below), 1 Oct 2026, 20-session walk-forward with the account rules:
  # earlier ten sessions +2.83% -> +5.26%, judged ten +1.04% -> +4.73%
  # (+0.47R a trade, 50% won), drawdown unchanged at 1.0% / 2.0%.
  band_a: {min_atr_pct: 1.0}
  band_b: {min_atr_pct: 1.0}
  windows:
    morning_from: "09:45"
    morning_to: "11:30"
    afternoon_from: "13:30"
    afternoon_to: "15:45"            # 15 min before the close (5 Oct 2026; was 15:00)
    # General setups stopped at 14:00 ET from 3 Oct (40-session replay:
    # earlier half +0.09R -> +0.20R a trade, judged half unchanged); OFF from
    # 5 Oct 2026, the user's call: every entry runs to 15:45.
    general_to: ""

# The weekly review of 28 Sept - 2 Oct 2026, for GENERAL setups only (PD
# sweep, the volatility breakout and SJK 50-200 keep their own rules):
#   * RSI guard: no short below RSI 25, no long above 75. 40-session replay,
#     account rules: earlier half +0.09R -> +0.19R a trade, judged half
#     +0.20R -> +0.31R, drawdown 4.0% -> 3.0% and 2.7% -> 2.0%.
risk:
  rsi_guard: {enabled: true, short_min: 25, long_max: 75}
  # No entries after N losing trades in a day. OFF (0) from 5 Oct 2026, the
  # user's call: run without it for 3 days and compare. Tested (test 6, 40
  # sessions, account rules) at 2: first half +2.8% -> +3.8% (DD 4.0% ->
  # 3.0%), second half unchanged (+2.5%). Set 2 to switch it back on.
  max_losses_per_day: 0

# TRIAL (the user's call, 5 Oct 2026): a general setup needs 2 analysts
# voting its way at +/-0.25. The live week: 16 trades with a second analyst
# agreeing made +3.92R; 12 with the candlestick analyst alone made -0.18R.
# Not replayable (no news or macro history), so judged on the live weeks.
consensus:
  general_min_analysts: 2

derivatives:
  # US equity options are not lot-based; the contract multiplier does the work.
  lot_based: false
  contract_multiplier: 100
  weekly_expiry_weekday: 4     # Friday
  monthly_expiry_rule: "third_friday"
  strike_steps:
    SPY: 1
    QQQ: 1
    IWM: 1
    AAPL: 2.5
    MSFT: 5
    NVDA: 5
    TSLA: 5
    default_pct: 1.0

fundamentals:
  # US tickers need no Yahoo suffix.
  yahoo_suffix: ""

brokers:
  supported: ["paper", "alpaca"]
  default: "paper"

macro:
  vix_panic_level: 25.0        # VIX runs structurally higher than India VIX
  vix_calm_level: 14.0
  global_indices:
    - { key: "us_sp500",   label: "S&P 500 Futures", yahoo: "ES=F" }
    - { key: "us_nasdaq",  label: "Nasdaq Futures",  yahoo: "NQ=F" }
    - { key: "dow",        label: "Dow Futures",     yahoo: "YM=F" }
    - { key: "russell",    label: "Russell 2000",    yahoo: "RTY=F" }
    - { key: "vix",        label: "CBOE VIX",        yahoo: "^VIX" }
    - { key: "us10y",      label: "US 10Y Yield",    yahoo: "^TNX" }
    - { key: "dxy",        label: "Dollar Index",    yahoo: "DX-Y.NYB" }
    - { key: "crude",      label: "WTI Crude",       yahoo: "CL=F" }
    - { key: "gold",       label: "Gold",            yahoo: "GC=F" }

news:
  sources:
    - { name: "CNBC Markets", type: rss,
        url: "https://www.cnbc.com/id/20910258/device/rss/rss.html" }
    - { name: "CNBC Top News", type: rss,
        url: "https://www.cnbc.com/id/100003114/device/rss/rss.html" }
    - { name: "MarketWatch Top Stories", type: rss,
        url: "https://feeds.content.dowjones.io/public/rss/mw_topstories" }
    - { name: "Yahoo Finance", type: rss,
        url: "https://finance.yahoo.com/news/rssindex" }
    - { name: "Investing.com US", type: rss,
        url: "https://www.investing.com/rss/news_25.rss" }
    - { name: "Google News — US markets", type: rss,
        url: "https://news.google.com/rss/search?q=stock+market+OR+S%26P+500+OR+Nasdaq+when:1d&hl=en-US&gl=US&ceid=US:en" }

universe:
  # Three bands of 20, scanned every cycle. Remove a band from active_bands to
  # stop scanning it; the names stay here.
  #   A  the index ETFs and the largest, most liquid names
  #   B  large caps
  #   C  high-beta and mid caps — bigger moves, wider spreads
  active_bands: ["A", "B", "C"]
  indices:
    # These are ETFs, not indices: they trade as ordinary shares, so
    # cash_tradeable is true. A true index (NIFTY) has no cash instrument.
    - { symbol: "SPY", trading_symbol: "SPY", exchange: "ARCA",   lot_size: 1, fno: true, tick_size: 0.01, seed_price: 585,  cash_tradeable: true, band: "A", note: "S&P 500 ETF" }
    - { symbol: "QQQ", trading_symbol: "QQQ", exchange: "NASDAQ", lot_size: 1, fno: true, tick_size: 0.01, seed_price: 505,  cash_tradeable: true, band: "A", note: "Nasdaq 100 ETF" }
    # The gold desk: SPDR Gold, the shares held 1-4 days on the volatility
    # breakout (settings.yaml swing); never screened.
    - { symbol: "GLD", trading_symbol: "GLD", exchange: "ARCA", lot_size: 1, fno: false, tick_size: 0.01, seed_price: 330, cash_tradeable: true, band: "A", swing: true, note: "Gold ETF" }
    - { symbol: "IWM", trading_symbol: "IWM", exchange: "ARCA",   lot_size: 1, fno: true, tick_size: 0.01, seed_price: 228,  cash_tradeable: true, band: "A", note: "Russell 2000 ETF" }
