# SJK 50-200, the user's 50 / 200 EMA pullback: a trial from 2 Oct, as on the US,
# inside NSE hours.
sjk50_200:
  from: "09:30"
  to: "15:15"               # 15 min before the close (the user's call, 5 Oct)

# SJK 9/21 · VWAP · ADX, the user's confluence model: a trial from 5 Oct.
sjk912_vwapadx:
  from: "09:30"
  to: "15:15"               # 15 min before the close

# sjk912RSi, the user's 9/21 EMA + RSI crossover: OFF for India (the user's
# call, 5 Oct 2026) — 40 sessions through the account rules: 9 trades, -0.3%,
# the halves +2.2% / -2.6%. The US keeps it (20 trades, +3.7%).
sjk912rsi:
  enabled: false
  from: "09:30"
  to: "15:15"

# SJK 9-15-21, the user's 9 / 15 / 21 EMA fan: a trial from 5 Oct, as on the US.
sjk_9_15_21:
  from: "09:30"
  to: "15:15"               # 15 min before the close
