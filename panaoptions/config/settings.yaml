# ==========================================================================
# panaoptions — intraday US options paper trading on a $500 account.
# Every rule below is enforced in code. Change it here, not in the source.
# ==========================================================================

account:
  # Paper capital. Real money is not supported by this app at all: there is no
  # broker adapter, and nothing here can place an order anywhere.
  # $4,000 of paper capital: $800 a trade at the standard 20% cap, and
  # $1,000 (25%) on the high-notional index ETFs — SPY, QQQ, DIA — whose
  # near-the-money contracts cost $900-$1,000 on their own. See
  # risk.index_max_capital_deployed_pct and risk/gatekeeper.py.
  #
  # Raising CAPITAL rather than the deployment percentage is deliberate: 40%
  # of $2,500 is the same $1,000 and doubles what one stop-out costs, from 4%
  # of the account to 8%, while leaving room for only one position instead of
  # three. Paper capital is a free parameter; risk ratios are not.
  #
  # PANAOPTIONS_CAPITAL in .env overrides this per machine.
  starting_capital: 4000.0
  currency: "$"

market:
  code: "US"
  name: "United States"
  exchange: "NYSE / NASDAQ / CBOE"

session:
  timezone: "America/New_York"
  # The regular session; the opening range and the volume profile use it.
  market_open: "09:30"
  market_close: "16:00"
  # Entries only inside this window. 09:30-09:35 is skipped deliberately:
  # opening spreads are wide and the first prints are noise.
  entry_open: "09:35"
  entry_close: "10:30"
  # Tighten stops to breakeven after this, before the midday volume slump.
  tighten_stops_at: "10:45"
  # Nothing may stay open past this — five minutes before the 16:00 close,
  # while the chain still quotes. The strategy windows run to 15:45, so the
  # last trade of the day still gets ten minutes rather than none.
  force_exit_at: "15:55"

data:
  # Where prices and option chains come from.
  #
  #   yahoo    No API key. Charts are reliable; the OPTION CHAIN endpoint is a
  #            different host and has become unreliable — it can refuse every
  #            request while charts work perfectly, which leaves the desk
  #            firing setups that all report "no contract". Yahoo also serves
  #            no greeks, so delta is estimated with Black-Scholes from
  #            implied volatility.
  #
  #   tradier  Needs a free account. Option chains are a first-class endpoint
  #            and come WITH greeks, so every delta band in this file is
  #            applied to the number the market is actually using rather than
  #            to an estimate. Put TRADIER_TOKEN in panaoptions/.env.
  #
  # `python run.py --check` tests whichever is selected, chains included.
  #
  #   auto     the default. Tries Yahoo's chains, falls back to CBOE when
  #            they refuse, and says on startup and on the dashboard which
  #            one it ended up using. Nothing to configure and nothing to
  #            run when Yahoo's endpoint changes its mind, which it does.
  provider: "auto"
  # Which Tradier environment the token came from. A sandbox token does not
  # work against production. Sandbox data is delayed, which is the right
  # trade for paper trading: the strategies are what is being tested.
  tradier_env: "sandbox"

universe:
  # The brief's universe. At-the-money contracts here cost $320-$1,800, so a
  # $500 account cannot buy one — see `python run.py --check-config`.
  symbols: ["SPY", "QQQ", "AAPL", "NVDA", "TSLA", "AMD", "MSFT", "AMZN"]

  # Liquid names whose at-the-money contracts land roughly $15-$100, so a small
  # account can actually take the trade rather than watch it. Swap this list
  # into `symbols` above if you want to keep the account at $500 and still
  # trade at the money.
  small_account_alternative:
    ["IWM", "PLTR", "INTC", "SOFI", "HOOD", "F", "XLF", "GDX"]

auto_watchlist:
  # The day's top names, picked before the open and re-checked every hour.
  # Sources (free, no account): Yahoo's most-active, gainers and losers
  # screeners, Yahoo trending, and the brokers' average analyst rating.
  # Ranked on the move, relative volume, analyst conviction (more when the
  # analysts agree with the move), how many lists a name is on, and liquidity.
  #
  #   A symbol with an open position is never replaced; once its trade has
  #   closed it can be, at the next hourly refresh. SPY and QQQ always stay.
  #   If every source fails the list in force is kept — never emptied.
  #   Typing a list on the dashboard turns this off; "Auto top 10" turns it
  #   back on. Every refresh is logged to journal/watchlist/<date>.jsonl.
  enabled: true
  size: 10
  start: "08:45"            # the pre-open build (the screen runs from 09:00)
  stop: "15:00"             # no refreshes after this — entries are ending
  refresh_minutes: 60
  retry_minutes: 10         # when no source answered
  swap_margin: 0.10         # an hourly newcomer must beat the weakest by this
  pinned: ["SPY", "QQQ"]
  screeners: ["most_actives", "day_gainers", "day_losers"]
  trending_region: "US"
  # Always ranked, so a thin morning still has names to choose from.
  always_consider: ["SPY", "QQQ", "IWM", "AAPL", "NVDA", "TSLA", "AMD", "MSFT",
                    "AMZN", "META", "GOOGL", "PLTR", "AVGO", "NFLX"]
  quote_types: ["EQUITY", "ETF"]
  # Contracts on a $600+ stock cost more than one trade may spend; under $10
  # the options are thin. Liquid names only.
  min_price: 10
  max_price: 600
  min_avg_volume: 2000000
  min_market_cap: 5000000000
  move_full_pct: 3.0        # a 3% move scores the trend part in full
  liquidity_full: 20000000
  weights: { trend: 0.25, volume: 0.25, analysts: 0.20, buzz: 0.15, liquidity: 0.15 }

fno:
  # The previous-day GO/NO-GO for every 5-minute candlestick strategy,
  # checked BEFORE the pattern is read: LONG CALL only after a clean sweep
  # below the previous-day low (PDL) that closed back inside; LONG PUT only
  # after a sweep above the PDH. No sweep: skipped, "No institutional sweep of
  # previous day extremes." (The sweep rule is the PD Liquidity Sweep's own.)
  go_no_go:
    enabled: true
    strategies: ["candlestick_at_level", "liquidity_sweep"]
  # The previous day's F&O picture, mapped for every watched symbol once a
  # day after the screen (and refreshed whenever a chain is read): PDH / PDL /
  # PDC from the tape, total call and put open interest and their change, and
  # the build-up (Long Buildup, Short Buildup, Short Covering, Long Unwinding).
  ingest: true
  ingest_from: "09:00"      # before the 09:30 open (ET)
  confluence:
    # Reversal setups (Tweezer Bottom / swing-low reversals for calls, and the
    # mirror for puts) are taken ONLY where:
    #   LONG_CALL  the pattern swept the previous-day LOW and closed back above
    #              it, with call open interest rising;
    #   LONG_PUT   the pattern tested the previous-day HIGH and closed back
    #              below it, with put open interest rising.
    enabled: true
    strategies: ["pd_liquidity_sweep", "candlestick_at_level", "liquidity_sweep"]
    # sweep: a candle swept the PDL (calls) / PDH (puts) by no more than
    # proximity_pct and the NEXT candle closed back inside yesterday's range.
    # touch: the pattern's extreme within touch_atr of the level (the old test).
    mode: "sweep"
    proximity_pct: 0.25
    lookback_bars: 3
    touch_atr: 0.15          # "at the level" in touch mode: within this x ATR
    # A chain with no open interest (India on estimated prices) cannot show
    # rising OI. block = skip the setup (strict); allow = judge the level alone.
    when_oi_unknown: "block"

flow:
  # Unusual options activity: a contract trading min_volume_to_oi times its
  # open interest (and at least min_volume contracts) means new positions in
  # size. With pass_screen, a symbol showing it passes the screen even without
  # the gap and RVOL. On a fired setup it is reported as agreeing or opposing
  # — never a veto. Free feeds cannot show whether it traded at the ask.
  pass_screen: true
  min_volume_to_oi: 3.0
  min_volume: 1000
  max_dte: 60

premarket:
  min_rvol: 1.5          # relative volume vs the 20-day average at this time
  min_gap_pct: 1.0       # |open vs previous close|, in percent

  # Earliest the screen may run, in exchange time. There is no pre-market
  # volume at 04:00, so screening then returns RVOL near zero, nothing
  # qualifies, and the day is written off before it starts.
  screen_from: "09:00"
  # While nothing has qualified, try again this often — the pre-market tape
  # thickens as the open nears, and a name can gap or wake up mid-session.
  # Once something passes, it stops.
  rescreen_minutes: 1

technical:
  timeframe: "5m"
  trend_timeframe: "15m"
  fast_ema: 9
  slow_ema: 20
  atr_period: 14
  volume_lookback: 20
  volume_multiplier: 1.0   # candle volume must beat this x the average

contracts:
  min_dte: 7
  max_dte: 14
  # The primary tier: 0.40-0.50 delta, calls and puts alike. primary_band
  # holds every pattern to it too (a pattern's own band is ignored while it
  # is set); remove it to let each pattern ask for its own.
  min_delta: 0.40
  max_delta: 0.50
  primary_band: [0.40, 0.50]
  # Delayed quotes on single-stock options 2-6 weeks out routinely show
  # 5-10% spreads; at 5% nearly every name but SPY and QQQ was turned away.
  # The Risk Gatekeeper refuses anything wider than risk.max_spread_pct_of_mid
  # (7%) whatever this says; keeping the two equal stops the picker choosing
  # a contract the gate would then turn away.
  max_spread_pct_of_mid: 7.0
  # When the setup's delta band is over budget, buy the highest-delta contract
  # that fits instead of skipping the trade — but never below this delta.
  # 0 switches the fallback off. With the primary band at 0.40-0.50, this is
  # the secondary tier: 0.25-0.39 delta, and only if liquid (below) and
  # inside the spread limit.
  budget_fallback_min_delta: 0.25

  # What to try, in order, when the setup's own contract is over the per-trade
  # budget or the per-contract price ceiling. Anything still unfunded is a
  # hard risk failure: skipped, and logged as one.
  fallback_order: ["shorter_expiry", "debit_spread", "secondary_delta"]

  # The debit spread: buy the 0.40-0.50 delta contract, sell a further out-of-
  # the-money strike in the same expiry (bull call spread on a long, bear put
  # spread on a short). Held as one position at its net debit; the most it
  # can lose is that debit, the most it can make is the width minus it.
  debit_spread:
    enabled: true
    min_reward_risk: 0.8     # (width - debit) / debit
    min_net_debit: 0.10      # per share

  # When a debit spread cannot be built because no short leg is liquid or
  # priced, buy the long (0.40-0.50 delta) leg outright if its whole lot
  # premium (premium x lot) fits within this share of the per-trade budget.
  single_leg_grace:
    enabled: true
    max_budget_pct: 100

  # A wider bid-ask allowance in the opening minutes, for 0-4 DTE contracts
  # only. Off in the US by default; the India overlay switches it on for
  # 09:15-10:00 IST at 12%.
  opening_spread:
    enabled: false
    from: "09:30"
    to: "10:15"
    max_dte: 4
    max_spread_pct: 12.0

  # Liquid enough for a believable fill at the mid: open interest OR volume.
  # Applied to the 0.30-0.39 tier and to both legs of a debit spread.
  liquidity:
    min_open_interest: 100
    min_volume: 50

  # The spread check uses the 1-minute volume-weighted average bid-ask spread,
  # not one snapshot: a quote that flashes wide at the open is sampled again
  # inside the minute rather than refused on sight.
  rolling_spread:
    enabled: true
    window_seconds: 60
    resamples: 2
    resample_delay_seconds: 5

  # --------------------------------------------------------------------
  # These two are a SANITY CEILING, not position sizing.
  #
  # They used to be $0.60-$1.00, which combined with the 0.45-0.60 delta
  # band above described an empty set: that delta means at the money, one
  # contract is 100 shares, and at-the-money 7-14 days out costs $320 on
  # AAPL and $1,800 on TSLA. The filter correctly returned nothing, for
  # ever.
  #
  # The cap is now high enough that every name in the universe can pass it.
  # How much you actually buy is decided by risk.max_capital_deployed_pct
  # below, which is where position sizing belongs — a price cap doing risk
  # management is a rule in the wrong place, and it fails silently.
  #
  # `python run.py --check-config` re-checks that every rule here can hold
  # at once, and says what to change when they cannot.
  # --------------------------------------------------------------------
  min_contract_price: 0.10      # $10 a contract — below this it is a lottery ticket
  max_contract_price: 20.00     # $2,000 a contract — a ceiling, not a target
  # Raised ceiling for risk.index_symbols (profiles with a low ceiling use it).
  index_max_contract_price: 20.00
  contract_multiplier: 100

strategies:
  # Each strategy runs only inside its own window, in EXCHANGE time. All of
  # them avoid 09:30-09:45, where spreads are widest and the first prints are
  # noise, and all hunt until 15:45 — the last entry that still leaves the
  # trade ten minutes before the 15:55 square-off.
  # The Previous Day Liquidity Sweep (failed breakout), first in line: a 5m
  # candle sweeps the previous-day LOW (calls) / HIGH (puts) by no more than
  # proximity_pct, and the NEXT candle closes back inside yesterday's range,
  # as a tweezer or swing low/high. Stop: stop_ticks beyond the sweep wick.
  # Target: VWAP or min_reward_risk (3R), whichever is further. Rising call /
  # put open interest is required by fno.confluence.
  pd_liquidity_sweep:
    enabled: true
    from: "09:45"
    to: "15:00"
    proximity_pct: 0.25
    lookback_bars: 3
    require_pattern: true      # a tweezer or swing low/high at the sweep
    # Only the FIRST run beyond the level today counts: the stops there are
    # taken once. Backtest (10 sessions, SPY/QQQ/NVDA/AAPL/TSLA): without it
    # the same PDH "swept" up to 6 times a day — 84 trades, 26% winners.
    first_test_only: true
    tick: 0.01                 # $0.01 (the India overlay: ₹0.05)
    stop_ticks: 2
    min_reward_risk: 3.0
  orb_vwap:
    enabled: true
    from: "09:45"        # the 15m opening range is not final until 09:45
    to:   "15:45"
    volume_multiple: 1.5
    target_range_multiple: 1.5     # take profit at 1.5x the range height
  vwap_ema_pullback:
    enabled: true
    from: "10:00"
    to:   "15:45"
    volume_multiple: 1.0
    touch_atr: 0.35      # how close to the line counts as a pullback
  liquidity_sweep:
    enabled: true
    from: "09:45"
    to:   "15:45"
    volume_multiple: 1.5

  # Seven reversal patterns, but only where one can mean something. A hammer
  # in the middle of a range is a bar with a wick; the level is the larger
  # half of the rule, and level_tolerance_atr is what "at the level" means.
  candlestick_at_level:
    enabled: true
    from: "09:45"
    to:   "15:45"
    timeframe: "15m"          # patterns pay on the higher timeframes
    level_tolerance_atr: 0.5  # how close to a level still counts as "at" it
    # The entry is a break of the pattern's trigger, which happens on a LATER
    # candle — so the pattern may be this many bars back and still count.
    trigger_within_bars: 2
    volume_multiple: 1.0
    # Longer-dated than the intraday strategies: these are structural turns,
    # and theta must not eat the move before it happens.
    min_dte: 14
    max_dte: 30
    # How many bars of run-in decide whether a pattern interrupted a trend.
    # Most of these mean nothing without one: three long red candles after a
    # rally is distribution, the same three mid-range is noise.
    trend_lookback: 10

    # Each pattern asks for its own contract — a sharp reversal off a level and
    # a four-candle structural turn are not the same bet and do not want the
    # same delta or the same amount of time.
    #
    # `claimed_accuracy` is the win rate the pattern is PUBLISHED as having,
    # recorded here as a claim so the journal can hold it against what the
    # pattern actually does on this desk. Those figures come from studies of
    # DAILY bars on equities; this desk reads a 15m intraday tape, where they
    # are a hypothesis and nothing more. Nothing in the risk or sizing path
    # reads this number — it is for the review, not for the decision.
    patterns:
      hammer:
        delta: [0.50, 0.65]
        dte:   [14, 30]
      bullish_engulfing:
        delta: [0.55, 0.70]
        dte:   [14, 30]
      morning_star:
        delta: [0.45, 0.55]
        dte:   [14, 30]
      tweezer_bottom:
        delta: [0.50, 0.65]
        dte:   [14, 30]
      shooting_star:
        delta: [0.50, 0.60]
        dte:   [14, 30]
      bearish_engulfing:
        delta: [0.55, 0.65]
        dte:   [14, 30]
      evening_star:
        delta: [0.45, 0.55]
        dte:   [14, 30]
      tweezer_top:
        delta: [0.50, 0.65]
        dte:   [14, 30]

      # --- the multi-candle structures ---------------------------------- #
      # In the money, and given real time: candle 4 is wide, so a higher delta
      # is what keeps theta from eating the expansion it is betting on.
      bullish_three_line_strike:
        delta: [0.65, 0.75]
        dte:   [30, 45]
        claimed_accuracy: 0.84
      bearish_three_line_strike:
        delta: [0.65, 0.75]
        dte:   [30, 45]
        claimed_accuracy: 0.84
      three_black_crows:
        delta: [0.55, 0.65]
        dte:   [21, 35]
        claimed_accuracy: 0.78
      three_white_soldiers:
        delta: [0.50, 0.60]
        dte:   [30, 45]
        claimed_accuracy: 0.75
      bullish_abandoned_baby:
        delta: [0.50, 0.60]
        dte:   [14, 30]
        claimed_accuracy: 0.70
      bearish_abandoned_baby:
        delta: [0.50, 0.60]
        dte:   [14, 30]
        claimed_accuracy: 0.70
      piercing_line:
        delta: [0.50, 0.60]
        dte:   [14, 30]
        claimed_accuracy: 0.67
      dark_cloud_cover:
        delta: [0.50, 0.60]
        dte:   [14, 30]
        claimed_accuracy: 0.67
      # A wick that pierced the level and closed back inside. Not a separate
      # detector: it is what a hammer or shooting star IS when it takes the
      # stops beyond a level first.
      liquidity_sweep_rejection:
        delta: [0.55, 0.65]
        dte:   [14, 30]
        claimed_accuracy: 0.80

  # --- The volume-profile family ----------------------------------------
  # Built on each session's volume by price (RTH 09:30-16:00 ET): the POC,
  # the 70% value area (VAL-VAH) and the low/high volume nodes. See
  # strategies/volume_profile_strategies.py and the volume_profile block.
  va_rejection:            # failed auction at the VAH (put) / VAL (call) → POC
    # OFF: lost in every run on 29 Sept — US -1.08R/-1.23R a trade in the
    # walk-forward test half (0% winners), India -0.55R edge. With it off,
    # the US went from -$88 to +$71 on the same fills. Re-enable with true and
    # re-run `python run.py --backtest` to see whether it earns back.
    enabled: false
    from: "09:45"
    to:   "15:45"
    lookback_bars: 2       # the poke/test may be this many bars back
  lvn_acceleration:        # shelf → close into a volume pocket on RVOL ≥ 1.5x
    enabled: true
    from: "09:45"
    to:   "15:45"
    min_rvol: 1.5
    shelf_bars: 3
  poc_bounce:              # ≥ 1 ATR away, back to the POC, rejected there
    # OFF: the worst strategy in every backtest run — US -1.08R a trade at a
    # 10% win rate, India -0.32R (validation, 29 Sept 2026). Re-enable with
    # true and re-run `python run.py --backtest` to see whether it earns back.
    enabled: false
    from: "10:00"
    to:   "15:45"
    away_atr: 1.0

volume_profile:
  rth_open: "09:30"
  rth_close: "16:00"
  bins: 40                 # price bins per session
  value_area_pct: 0.70
  lvn_ratio: 0.30          # a bin at <= 0.30x the mean bin is thin (LVN)
  hvn_ratio: 1.5           # a bin at >= 1.5x the mean bin is thick (HVN)
  # Confluence on EVERY signal, in the Technical agent: entering at a VAL/POC
  # (calls) or VAH/POC (puts) adds alignment_boost to its score; a thick HVN
  # straight ahead costs hvn_penalty within hvn_near_atr ATR, and is a veto
  # within hvn_veto_atr ATR.
  alignment_tolerance_atr: 0.25
  alignment_boost: 0.30
  hvn_near_atr: 1.0
  hvn_veto_atr: 0.25
  hvn_penalty: 0.30

risk:
  # The asymmetric gate: every trade's projected target must be at least
  # this many times the distance from entry to the invalidation level (1:3),
  # with no previous-day / opening-range / pre-market level in the way.
  min_reward_risk: 3.0
  reward_room_levels: ["previous_day", "opening_range", "premarket"]
  # These two must reach 1:3 with their OWN target — the POC for a value-area
  # rejection, VWAP-or-3R for the previous-day sweep — before the risk gate.
  # Others may use a projected 3R when the road to it is open.
  own_target_strategies: ["pd_liquidity_sweep", "va_rejection"]
  # --- The tournament throttles (Robbins World Cup style) ----------------
  # Two names at once, four trades a day at most. Over-trading is how a
  # good morning is given back: the 10-session backtest took 400+ setups
  # with no throttle, and the extra trades were the losing ones.
  max_open_trades: 2
  # Three trades a day, win or lose: once three have been taken the scanner
  # shuts down for the rest of the calendar session (restarts included).
  max_daily_trades: 3
  # Of those three, the last one is kept for the strategies with the best
  # backtested edge (ranking, below): first-come-first-served handed the day
  # to whatever fired earliest — mostly the weaker morning setups.
  reserved_slots: 1
  # The most one trade may LOSE at its first stop, as a share of capital:
  # 2% = $80 on $4,000. max_capital_deployed_pct (below) still caps the
  # PREMIUM; this caps the loss, and whichever is tighter sizes the trade.
  # (2% of capital as the premium itself would be $80 — not one at-the-money
  # SPY contract, so the desk would never trade.)
  max_risk_per_trade_pct: 2.0
  # One position per symbol: a setup stays valid for several cycles, and
  # without this the same idea was bought again every minute (AMZN x5, x3).
  one_position_per_symbol: true
  # After a symbol's trade closes, wait this long before trading it again —
  # a stopped-out setup is not bought straight back.
  reentry_cooldown_minutes: 15

  # --- What "wrong" means ------------------------------------------------
  # underlying  the strategy's own invalidation level decides the exit. A
  #             fixed percentage on the premium is at the mercy of an implied
  #             volatility shift or a wide spread and says nothing about
  #             whether the trade was wrong. This is the recommended mode.
  # premium     the old behaviour: a fixed % stop on the contract price.
  #
  # In underlying mode the percentage stop below becomes a DISASTER backstop
  # only — it still catches a gap or a collapse in the option itself, but it
  # is set wide enough that the underlying level is what normally fires.
  stop_mode: "underlying"
  disaster_stop_pct: 45.0

  # --- One contract cannot be halved -------------------------------------
  # scale     exit take_profit_1_size_pct at TP1, run the rest to TP2/trail.
  # trail     at breakeven_trigger_pct move the stop to breakeven, then hold
  #           until a 5m candle closes on the far side of the 9 EMA.
  # auto      trail when the position is a single contract, scale otherwise.
  # r_multiple  judged on the UNDERLYING in units of the trade's risk: at
  #           +scale_out_r sell take_profit_1_size_pct (half) and move the stop
  #           to breakeven (one contract: only the stop moves), then trail the
  #           rest runner_trail_r behind the best level reached.
  #
  # auto exists because a $400 budget buys one contract, and "exit 50% at
  # +40%" on one contract silently becomes "exit everything at +40%" — the
  # runner the strategy depends on never exists.
  #
  # r_multiple since 29 Sept 2026: wins averaged ~1.2R against 3R targets
  # (most trades squared off first). The 20-session walk-forward backtest on
  # the same fills: India expectancy -0.07R -> +0.23R, P&L +₹7,090 -> +₹30,883
  # (+8.8%); US P&L -$138 -> -$88 (+$71 with Value Area Rejection off).
  exit_style: "r_multiple"
  scale_out_r: 1.5
  runner_trail_r: 1.0
  breakeven_trigger_pct: 35.0
  # Premium paid as a share of the account. This is capital DEPLOYED, not
  # capital at risk: the stop below is what decides the real loss.
  max_capital_deployed_pct: 20.0
  # The dynamic index exception: these tickers may deploy up to 25% ($1,000
  # on $4,000) so a valid at- or near-the-money contract is not refused on
  # notional alone. "DJI" is read as DIA, the Dow ETF.
  index_symbols: ["SPY", "QQQ", "DIA"]
  index_max_capital_deployed_pct: 25.0
  # The gatekeeper's liquidity filter: refuse any contract whose bid-ask
  # spread is more than this share of the mid.
  max_spread_pct_of_mid: 7.0

  # The ceiling on ALL open positions together, and the reason the line above
  # is not the whole rule: three trades at 20% each satisfy the per-trade cap
  # every single time and put 60% of the account to work. Unset, this falls
  # back to the per-trade budget rather than to "no limit".
  #
  # At 45%, two positions go on at full size and a third takes what is left,
  # sizing itself down rather than being refused. Long options can expire
  # worthless, so this is the number to lower first if three at once feels
  # like too much — `--check-config` prints what the worst case costs.
  max_total_deployed_pct: 45.0
  # Hard stop on the contract price itself.
  stop_loss_pct: 20.0
  # So the real risk per trade is 20% of 20% = 4% of the account. The app
  # prints both numbers on every signal so the distinction stays visible.
  take_profit_1_pct: 40.0        # scale out half here
  take_profit_1_size_pct: 50.0
  take_profit_2_pct: 70.0        # or the 9-EMA trail, whichever comes first
  trail_on_ema: true
  breakeven_after_tp1: true
  # Halt for the rest of the day at this cumulative loss.
  #
  # Expressed as a PERCENTAGE so it tracks the account. The brief states the
  # rule as "-$50, which is 10% of total capital" — $50 was the instance at
  # $500, not the rule. Pinning the dollar figure means that raising capital
  # to $2,000 leaves a limit smaller than a single stop-out, so the breaker
  # trips on the first loser and the desk is really a one-trade-a-day rule
  # without ever saying so.
  # Close a position that has not reached its first target within this many
  # minutes. null means no time limit, which is right for a desk holding
  # 7-45 day contracts: there, time is what you paid for. A same-day contract
  # is the opposite — see the scalp profile.
  max_hold_minutes: null

  # The hard daily circuit breaker: 3% ($120 on $4,000), realised plus open.
  # When hit: pending signals are cancelled, open positions are sold, the
  # order path refuses, and the lockout is saved — it holds for the rest of
  # the calendar day, restarts included.
  daily_loss_limit_pct: 3.0
  # Set this to a number to override the percentage with a fixed amount.
  daily_loss_limit: null
  # Simulated fill cost per contract, per side.
  slippage_per_contract: 0.02

ranking:
  # How the day's scarce slots are ranked: each strategy's expectancy (R per
  # fill, before the throttles) from the last `run.py --backtest` on this
  # market, needing min_fills fills to count. PREFERRED = an edge above
  # min_edge_r. Before any validation exists, this priority order decides and
  # the first preferred_top are preferred (from the 29 Sept backtests: the
  # opening-range breakout and the previous-day sweep earned in both runs).
  min_fills: 5
  min_edge_r: 0.0
  preferred_top: 2
  priority: ["pd_liquidity_sweep", "orb_vwap", "candlestick_at_level", "liquidity_sweep",
             "vwap_ema_pullback", "va_rejection", "lvn_acceleration", "poc_bounce"]

backtest:
  # `python run.py --backtest` — the rule book must earn its keep on history
  # before it trades: expectancy per trade (P&L / the loss planned at the stop)
  # of at least 0.5R, and a max drawdown under 5%, after the sizing, the
  # throttles and the daily breaker. Fewer than min_trades is INCONCLUSIVE.
  validation:
    min_expectancy_r: 0.5
    max_drawdown_pct: 5.0
    min_trades: 20
    # 20 sessions, walked forward: the strategy ranking is learned on the
    # first half and the verdict is judged on the second half only, so the
    # rule book is never graded on the days it was tuned on.
    days: 20
    walk_forward: true

journal:
  # Grade every closed trade the moment it closes, and write a card to
  # journal/cards/. Process over outcome: a winning trade that broke a rule
  # scores low, and a losing trade that honoured its invalidation scores high.
  auto_grade: true

  # Let a local model write the card's PROSE. It never decides the verdict,
  # the score, a stop or a size — those stay deterministic, because a model
  # that has read a profitable trade is very good at finding reasons it was
  # fine.
  #
  # Safe to leave on: if Ollama is not running, or the model is not pulled,
  # every card falls back to the rules-written version and the failure is
  # logged once rather than per trade. `run.py --check-llm` says which you
  # are getting, so "on" and "actually working" stay distinguishable.
  use_llm: true
  ollama_model: "qwen2.5:7b"
  ollama_host: "http://127.0.0.1:11434"
  ollama_timeout: 120
  llm_label: "ollama (qwen2.5:7b, local)"

  # Write the day's review to journal/daily/ once the session closes, and the
  # week's to journal/weekly/ once Friday's does.
  #
  # A day says how the session was EXECUTED. Which strategy actually works is
  # a question a single session cannot answer, so the daily review declines to
  # answer it and the weekly one does.
  auto_daily_review: true
  auto_weekly_review: true

# --------------------------------------------------------------------------
# The committee that votes on every fired setup before the Risk Gatekeeper.
#   Technical    5m/15m chart; relative volume >= min_rvol is a hard gate
#   Derivatives  the contract, put/call ratio, IV percentile, unusual flow
#   Macro        headlines + ES/NQ futures; a catalyst against = hard veto
#   CMIO         weighted score x strategy weight >= approve_threshold
# Each agent scores by rules; with Ollama running, the local model's opinion
# is blended in at llm_weight. Ollama down or slow = rules only, never a stall.
# --------------------------------------------------------------------------
agents:
  enabled: true
  use_llm: true                 # uses journal.ollama_model / ollama_host
  llm_weight: 0.4
  llm_timeout_seconds: 20
  approve_threshold: 0.55
  weights:
    technical: 0.35
    derivatives: 0.35
    macro: 0.30
  technical:
    min_rvol: 1.5
    # Derivatives Confluence Override: with extreme flow (>= extreme_flow_ratio
    # x OI) on the trade's own side, the RVOL gate relaxes to this.
    flow_confluence_min_rvol: 1.3
  derivatives:
    preferred_max_dte: 1        # 0DTE/1DTE score a bonus
    # Extreme options flow: a contract at >= this many times its open
    # interest. AGAINST the trade it is a strict veto (no calls into heavy
    # institutional put buying); WITH it, it relaxes the RVOL gate above.
    # Either way the Derivatives vote counts this many times more meanwhile.
    extreme_flow_ratio: 10.0
    extreme_flow_weight_multiplier: 2.0
    max_pcr_against: 1.5
    iv_percentile_ceiling: 80
  macro:
    lookback_hours: 18
    futures: ["ES=F", "NQ=F"]
    futures_veto_pct: 1.5

# Per-strategy multipliers on the committee score (0.25-1.5). The Friday
# reflection writes its adjustments to config/learned.yaml, which is merged
# over this file and never committed — so `git pull` cannot conflict with it.
strategy_weights:
  pd_liquidity_sweep: 1.0
  orb_vwap: 1.0
  vwap_ema_pullback: 1.0
  liquidity_sweep: 1.0
  candlestick_at_level: 1.0
  va_rejection: 1.0
  lvn_acceleration: 1.0
  poc_bounce: 1.0

reflection:
  enabled: true                 # run after Friday's close, once a week
  min_trades: 5                 # fewer closed trades = no adjustment
  max_step: 0.15                # no weight moves more than this in one week

ml:
  enabled: false                 # needs the extra packages; see docs
  min_probability: 0.65
  target_atr_multiple: 1.5       # a win is +1.5 ATR ...
  stop_atr_multiple: 1.0         # ... before -1.0 ATR
  horizon_bars: 6                # within 6 five-minute candles
  train_window_days: 120
  test_window_days: 20

notify:
  # Left blank = no webhook calls are made at all.
  discord_webhook_url: ""
  telegram_bot_token: ""
  telegram_chat_id: ""
