# ==========================================================================
# profile: swing — the swing book ALONE (no same-day strategies).
#
# The swing book normally runs inside the 0DTE desk (profiles/zerodte.yaml),
# in the same paper account; settings.yaml `swing:` has its rules and the
# evidence. This profile is for running it on its own:
#
#   PANAOPTIONS_PROFILE=swing PANAOPTIONS_DESK_DIR=swing PANAOPTIONS_PORT=8102
#
# (PANAOPTIONS_DESK_DIR keeps its book, journal and learned weights apart
# from the main desk's.)
# ==========================================================================

swing:
  enabled: true
  only: true
  symbols: []              # the universe below (India: markets/in.yaml's swing list)

risk:
  exit_style: "r_multiple"
  stop_mode: "underlying"
  max_hold_minutes: null

# The names the breakout was backtested on, gold (GLD) first: its evidence
# is the strongest of all (option R +0.20 / +0.16 a trade over two years of
# hourly bars, +0.20 on the last 60 days of 5-minute bars).
universe:
  symbols: ["GLD", "SPY", "QQQ", "AAPL", "NVDA", "TSLA", "AMD", "MSFT", "AMZN", "META",
            "GOOGL"]
auto_watchlist:
  enabled: false
